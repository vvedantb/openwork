name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Skip the husky `prepare` hook during install.
  HUSKY: "0"

jobs:
  checks:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `!cancelled()` runs every check even if an earlier one fails,
      # so one run reports all problems.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      # Tests run in CI because a test that nothing runs protects nothing.
      - name: Tests
        if: ${{ !cancelled() }}
        run: pnpm test
